const pad=n=>String(n).padStart(2,'0'),ymd=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),hm=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())},nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
