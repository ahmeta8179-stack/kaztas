/* Hareket */
nav{transform:translateX(-104%);transition:transform .34s var(--ease)}.dv.on nav{transform:none}
.dv.on nav a{animation:navin .42s var(--ease) backwards}.dv.on nav a:nth-child(2){animation-delay:0.035s}.dv.on nav a:nth-child(3){animation-delay:0.070s}.dv.on nav a:nth-child(4){animation-delay:0.105s}.dv.on nav a:nth-child(5){animation-delay:0.140s}.dv.on nav a:nth-child(6){animation-delay:0.175s}.dv.on nav a:nth-child(7){animation-delay:0.210s}.dv.on nav a:nth-child(8){animation-delay:0.245s}.dv.on nav a:nth-child(9){animation-delay:0.240s}.dv.on nav a:nth-child(10){animation-delay:0.270s}.dv.on nav a:nth-child(11){animation-delay:0.300s}.dv.on nav a:nth-child(12){animation-delay:0.330s}.dv.on nav a:nth-child(13){animation-delay:0.336s}.dv.on nav a:nth-child(14){animation-delay:0.364s}.dv.on nav a:nth-child(15){animation-delay:0.392s}.dv.on nav a:nth-child(16){animation-delay:0.420s}.dv.on nav a:nth-child(17){animation-delay:0.448s}.dv.on nav a:nth-child(18){animation-delay:0.476s}

.sh{transform:translateY(100%);transition:transform .38s var(--ease)}.ov.on .sh{transform:none}
.sh.sw{animation:swap .3s var(--ease)}@keyframes swap{from{opacity:.3;transform:translateY(14px)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.ani{animation:up .48s var(--ease) backwards;animation-delay:calc(var(--i,0)*38ms)}
.strip.ani{animation-name:fadein}@keyframes fadein{from{opacity:0}}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.ck.pop{animation:pop .42s var(--ease)}.ck.pop svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .34s .12s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fab{transition:transform .32s var(--ease),opacity .25s ease,box-shadow .2s ease}.fab.off{transform:scale(.4) rotate(-90deg);opacity:0;pointer-events:none}.fab:active{transform:scale(.9)}

.chip:active,.btn:active,.bt button:active,.mb:active{transform:scale(.96)}.ck:active{transform:scale(.86)}.sb:active{transform:scale(.92)}
.th,.cv{transition:transform .25s var(--ease),box-shadow .25s ease}.rc:active .th,.bk:active .cv{transform:scale(.97)}

function gstat(c){const G=c.grades||[];if(!G.length)return null;let W=0,K=0,P=0;G.forEach(g=>{const w=+g.w||0;W+=w;if(g.score!==''&&g.score!=null&&!isNaN(+g.score)){K+=w;P+=w*(+g.score)}});const pass=+S.cfg.pass||50,R=W-K;return{W,K,P,R,pass,avg:K?P/K:null,need:R>0?(pass*W-P)/R:null,done:K===W&&W>0}}
function gsum(g){if(!g||!g.K)return'<p class="mut" style="margin:10px 0 0">Notlarını girdikçe ortalaman burada hesaplanır.</p>';
let h=`<div style="margin-top:12px"><span class="avg">${f1(g.avg)}</span> <span class="mut">${g.done?'dönem ortalaması':'girilen notların ortalaması'}</span></div>`;
if(g.done)h+=g.avg>=g.pass?`<p class="okc" style="margin:6px 0 0"><b>Geçme notunu (${g.pass}) tutturdun.</b></p>`:`<p class="bad" style="margin:6px 0 0"><b>Geçme notunun (${g.pass}) altında kaldı.</b></p>`;
else if(g.need!=null){const n=g.need;h+=n<=0?`<p class="okc" style="margin:6px 0 0"><b>Kalan değerlendirmelerden kaç alırsan al geçme notunu (${g.pass}) tutturuyorsun.</b></p>`:n>100?`<p class="bad" style="margin:6px 0 0"><b>Kalan değerlendirmelerden 100 alsan bile geçme notuna (${g.pass}) ulaşılamıyor.</b></p>`:`<p style="margin:6px 0 0"><b>Geçmek için kalanlardan en az ${Math.ceil(n-1e-9)} alman gerekiyor.</b><span class="sub">Geçme notu ${g.pass} · kalan ağırlık %${g.R}</span></p>`}
if(g.W!==100)h+=`<p class="mut" style="margin:6px 0 0">Yüzdelerin toplamı %${g.W}. Doğru hesap için toplam %100 olmalı.</p>`;return h}
function gradesCard(c){const G=c.grades||[];let h='<div class="card"><h3>Notlar ve ortalama</h3>';
if(!G.length)h+=`<p class="mut" style="margin-top:0">Dersin değerlendirmelerini ve yüzdelerini gir; ortalaman ve geçmek için gereken not hesaplansın.</p><div class="btnrow"><button class="chip" data-a="gpreset" data-id="${c.id}" data-k="1">Vize %40 · Final %60</button><button class="chip" data-a="gpreset" data-id="${c.id}" data-k="2">Vize %30 · Ödev %20 · Final %50</button><button class="chip" data-a="addg" data-id="${c.id}">Kendim ekleyeyim</button></div>`;
else h+=`<table class="gt"><tbody>${G.map(x=>`<tr><td>${esc(x.name)}</td><td class="mut">%${x.w}</td><td><input type="number" min="0" max="100" step="any" inputmode="decimal" placeholder="Not" data-gr="${c.id}|${x.id}" value="${x.score==null?'':x.score}" aria-label="${esc(x.name)} notu"></td><td><button class="x2" data-a="delg" data-id="${c.id}|${x.id}" aria-label="${esc(x.name)} sil">×</button></td></tr>`).join('')}</tbody></table><div class="btnrow" style="margin-top:10px"><button class="chip" data-a="addg" data-id="${c.id}">+ Değerlendirme ekle</button></div><div class="gs">${gsum(gstat(c))}</div>`;
return h+'</div>'}

const tzone=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){return''}})();
const cdt=(d,t)=>d.replace(/-/g,'')+(t?'T'+t.replace(':','')+'00':'');
function evSpec(id){const t=S.tasks.find(x=>x.id===id);if(t){const m=mode(t),c=cn(t.cid),desc=[t.detail,(t.subs||[]).map(s=>'• '+s.text).join('\n'),c?'Ders: '+c.name:''].filter(Boolean).join('\n\n'),s={title:t.title,desc,loc:t.place||'',date:t.date||ymd(),time:t.time,etime:t.etime};
if(m==='range'){if(t.time){s.rrule='FREQ=DAILY;UNTIL='+cdt(t.end)+'T235959'}else s.end=t.end}
else if(m==='daily'){s.date=nextOcc(t);s.rrule=(t.wd||[]).length?'FREQ=WEEKLY;BYDAY='+t.wd.map(i=>['MO','TU','WE','TH','FR','SA','SU'][i-1]).join(','):'FREQ=DAILY'}
else if(m==='none')s.date=ymd();return s}
const x=S.exams.find(e=>e.id===id);if(x)return{title:exLabel(x)+' sınavı',desc:'KAZTAŞ sınav hatırlatması',loc:x.place||'',date:x.date,time:x.time,etime:x.time?addMin(x.time,120):''};return null}
function evDates(s){if(s.time){const e=s.etime&&s.etime>s.time?s.etime:addMin(s.time,60);return[cdt(s.date,s.time),cdt(s.date,e)]}return[cdt(s.date),cdt(addD(s.end||s.date,1))]}
function gcal(s){const[a,b]=evDates(s),e=encodeURIComponent;return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+e(s.title)+'&dates='+a+'/'+b+(s.desc?'&details='+e(s.desc):'')+(s.loc?'&location='+e(s.loc):'')+(s.time&&tzone?'&ctz='+e(tzone):'')+(s.rrule?'&recur='+e('RRULE:'+s.rrule):'')}
function icsText(s){const q=x=>String(x||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');const[a,b]=evDates(s),al=!s.time;
const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KAZTAS//TR','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+nid()+'@kaztas','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),(al?'DTSTART;VALUE=DATE:':'DTSTART:')+a,(al?'DTEND;VALUE=DATE:':'DTEND:')+b,'SUMMARY:'+q(s.title)];
if(s.desc)L.push('DESCRIPTION:'+q(s.desc));if(s.loc)L.push('LOCATION:'+q(s.loc));if(s.rrule)L.push('RRULE:'+s.rrule);L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+q(s.title),'TRIGGER:'+(al?'PT9H':'-PT15M'),'END:VALARM','END:VEVENT','END:VCALENDAR');return L.join('\r\n')}
async function saveIcs(id){const s=evSpec(id);if(!s)return;const name=(s.title||'plan').replace(/[\\/:*?"<>|]/g,'').trim().slice(0,40)||'plan',f=new File([icsText(s)],name+'.ics',{type:'text/calendar'});
const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);toast('Takvim dosyası indirildi. Açınca takvimine eklenir.')}

sheet(`<h3>Takvime ekle</h3><p class="mut" style="margin-top:0">${esc(s.title)} · ${s.rrule?'tekrarlanan etkinlik':sd2(s.date)+(s.time?' '+s.time:'')}<br>Telefonunun takvimine eklersen saati gelince takvim sana hatırlatır.</p><div class="bt" style="flex-direction:column"><a class="btn pri" href="${esc(gcal(s))}" target="_blank" rel="noopener noreferrer">Google Takvim'e ekle</a>${app?`<button data-a="ics" data-id="${id}">Takvim dosyası indir (.ics)</button><p class="mut" style="margin:0">Google Takvim kullanmıyorsan dosyayı indir ve aç; iPhone'da ve diğer takvim uygulamalarında da çalışır.</p>`:''}<button data-a="cl">Kapat</button></div>`)}

/* ===== Odak zamanlayıcısı ===== */
function audioInit(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){try{if(!actx)return;if(actx.state==='suspended')actx.resume();const t0=actx.currentTime+.05;[0,.32,.64].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;os.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t0+o);g.gain.exponentialRampToValueAtTime(.3,t0+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+o+.24);os.start(t0+o);os.stop(t0+o+.26)})}catch(e){}}
function notifPerm(){try{if(!window.claude&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
function alertDone(t,b){toast(t+'. '+b);beep();try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}
try{if(!window.claude&&'Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification('KAZTAŞ · '+t,{body:b,icon:'icon-192.png',tag:'kz-timer'})).catch(()=>{})}catch(e){}}
